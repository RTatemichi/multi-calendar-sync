<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Googleカレンダー同期アプリ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- サイドバー -->
            <div class="col-md-3 sidebar">
                <div class="sidebar-header">
                    <h4><i class="fas fa-calendar-alt"></i> カレンダー同期</h4>
                </div>
                
                <!-- アカウント管理 -->
                <div class="account-section">
                    <h5><i class="fas fa-users"></i> アカウント管理</h5>
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" id="user-id-input" placeholder="ユーザーIDを入力">
                        <button class="btn btn-primary" onclick="addAccount()">
                            <i class="fas fa-plus"></i> 追加
                        </button>
                    </div>
                    <div id="accounts-list" class="accounts-list">
                        <!-- アカウント一覧がここに表示されます -->
                    </div>
                </div>
                
                <!-- イベント作成 -->
                <div class="event-section">
                    <h5><i class="fas fa-plus-circle"></i> イベント作成</h5>
                    <form id="event-form">
                        <div class="mb-3">
                            <label for="event-title" class="form-label">タイトル</label>
                            <input type="text" class="form-control" id="event-title" required>
                        </div>
                        <div class="mb-3">
                            <label for="event-description" class="form-label">説明</label>
                            <textarea class="form-control" id="event-description" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="start-time" class="form-label">開始時刻</label>
                            <input type="datetime-local" class="form-control" id="start-time" required>
                        </div>
                        <div class="mb-3">
                            <label for="end-time" class="form-label">終了時刻</label>
                            <input type="datetime-local" class="form-control" id="end-time" required>
                        </div>
                        <div class="mb-3">
                            <label for="event-account" class="form-label">アカウント</label>
                            <select class="form-select" id="event-account" required>
                                <option value="">アカウントを選択</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100">
                            <i class="fas fa-save"></i> イベント作成
                        </button>
                    </form>
                </div>
            </div>
            
            <!-- メインコンテンツ -->
            <div class="col-md-9 main-content">
                <div class="content-header">
                    <h2><i class="fas fa-calendar-check"></i> イベント一覧</h2>
                    <button class="btn btn-outline-primary" onclick="refreshEvents()">
                        <i class="fas fa-sync-alt"></i> 更新
                    </button>
                </div>
                
                <!-- アラート表示エリア -->
                <div id="alert-container"></div>
                
                <!-- イベント一覧 -->
                <div id="events-container" class="events-container">
                    <!-- イベントがここに表示されます -->
                </div>
            </div>
        </div>
    </div>

    <!-- イベント編集モーダル -->
    <div class="modal fade" id="editEventModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">イベント編集</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-event-form">
                        <input type="hidden" id="edit-event-id">
                        <input type="hidden" id="edit-user-id">
                        <div class="mb-3">
                            <label for="edit-event-title" class="form-label">タイトル</label>
                            <input type="text" class="form-control" id="edit-event-title" required>
                        </div>
                        <div class="mb-3">
                            <label for="edit-event-description" class="form-label">説明</label>
                            <textarea class="form-control" id="edit-event-description" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="edit-start-time" class="form-label">開始時刻</label>
                            <input type="datetime-local" class="form-control" id="edit-start-time" required>
                        </div>
                        <div class="mb-3">
                            <label for="edit-end-time" class="form-label">終了時刻</label>
                            <input type="datetime-local" class="form-control" id="edit-end-time" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                    <button type="button" class="btn btn-primary" onclick="updateEvent()">更新</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
